appId: com.snapmaker.luban
productName: Snapmaker Luban
executableName: Snapmaker-Luban

directories:
    buildResources: build
    output: output
    app: dist/Luban

fileAssociations:
    - name: Project files
      role: Viewer
      ext:
        - snap3dp
        - snapcnc
        - snaplzr

#
# global pack options
#
# Everything under dist/Luban is packed into one archive, so a cold start reads
# a single file instead of crawling ~13k small ones (each scanned by antivirus
# on first open). Only what must exist as a real file on disk is left beside
# the archive, in app.asar.unpacked:
#   - native addons (.node), which the OS has to dlopen from a real path;
#   - the two engine packages, which spawn a binary out of their own package
#     directory (Electron translates execFile but not spawn - the server loads
#     them from the unpacked copy, see src/server/lib/paths.ts);
#   - the resources tree, copied into userData at startup and opened in the
#     file manager (engine-test).
# Everything else - the server bundle, the renderer, i18n, node_modules - is
# read through Electron's archive-aware fs, including from the forked server.
asar: true
asarUnpack:
    - '**/*.node'
    - 'node_modules/@snapmaker/snapmaker-lunar/**'
    - 'node_modules/snapmaker-luban-engine/**'
    - 'resources/**'

#
# publish options
#
publish:
    - provider: github
      repo: https://github.com/Snapmaker/Luban

#
# platforms and targets
#
mac:
    artifactName: Snapmaker-Luban-${version}-mac-${arch}.${ext}
    category: public.app-category.productivity
    target:
        - dmg
        - zip
    icon: build/electron/snapmaker-luban.icns
    hardenedRuntime: true
    gatekeeperAssess: false
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist


dmg:
    background: build/electron/background.png
    icon: build/electron/snapmaker-luban.icns
    iconSize: 80
    iconTextSize: 12
    contents:
        - type: link
          path: /Applications
          x: 448
          y: 344
        - type: file
          x: 192
          y: 344

win:
    artifactName: Snapmaker-Luban-${version}-win-${arch}.${ext}
    target:
        - nsis
    verifyUpdateCodeSignature: false
    icon: build/electron/snapmaker-luban.ico

nsis:
    oneClick: false
    perMachine: true
    allowElevation: true
    allowToChangeInstallationDirectory: true

linux:
    artifactName: Snapmaker-luban-${version}-linux-${arch}.${ext}
    category: Utility
    maintainer: parachute <ryan@snapmaker.com>
    target:
        - deb
        - rpm

deb:
    depends:
        - libnotify4
        - libxtst6
        - libnss3
        - libasound2
    # Default duties (symlink, SUID sandbox, desktop db) plus an AppArmor
    # userns profile for Ubuntu 23.10+ - see the scripts.
    afterInstall: build/linux-after-install.sh
    afterRemove: build/linux-after-remove.sh

rpm:
    # snapmaker-luban-X.Y.Z-linux.x86_64.rpm
    artifactName: Snapmaker-luban-${version}-linux.${arch}.${ext}
    afterInstall: build/linux-after-install.sh
    afterRemove: build/linux-after-remove.sh

#
# Hooks
#
afterSign: build/notarize.js
