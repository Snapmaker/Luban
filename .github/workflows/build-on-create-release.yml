name: Build Release Assets

on:
    release:
        types:
            # Includes prereleases published from drafts.
            - published
    workflow_dispatch:
        inputs:
            release_tag:
                description: 'Existing published release tag to rebuild (source is checked out at this tag)'
                required: true
                type: string
            platforms:
                description: 'Platforms to build'
                type: choice
                default: all
                options:
                    - windows
                    - macos
                    - linux
                    - all

permissions:
    contents: write

# Serialize uploads for the same release without interrupting a partial upload.
concurrency:
    group: release-assets-${{ inputs.release_tag || github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    release:
        name: Check Release
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            prerelease: ${{ steps.release.outputs.prerelease }}
        steps:
            - name: Resolve existing published release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
              run: |
                  git check-ref-format "refs/tags/$RELEASE_TAG"
                  release=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
                  if [ "$(jq -r '.isDraft' <<< "$release")" != false ]; then
                      echo "::error::Publish the release before building its assets."
                      exit 1
                  fi
                  echo "tag=$(jq -r '.tagName' <<< "$release")" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$(jq -r '.isPrerelease' <<< "$release")" >> "$GITHUB_OUTPUT"

    # Lint, type checks and tests of the release tag, beside the builds (which
    # do not wait for them); a failure is reported without blocking assets.
    checks:
        name: Checks
        needs: release
        uses: ./.github/workflows/checks.yml
        with:
            ref: refs/tags/${{ needs.release.outputs.tag }}
        secrets: inherit

    release-tooling:
        name: Publish MCP Tooling List
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout release source
              uses: actions/checkout@v4
              with:
                  ref: refs/tags/${{ needs.release.outputs.tag }}

            - name: Generate list and update release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ needs.release.outputs.tag }}
              run: |
                  gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes-before.md"
                  python3 scripts/generate_mcp_tooling.py \
                      --tag "$RELEASE_TAG" \
                      --repository "$GITHUB_REPOSITORY" \
                      --output "$RUNNER_TEMP/MCP-TOOLS.md" \
                      --notes-input "$RUNNER_TEMP/release-notes-before.md" \
                      --notes-output "$RUNNER_TEMP/release-notes-after.md"
                  gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/MCP-TOOLS.md" --clobber
                  gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes-after.md"

    build-windows:
        needs: release
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'windows' || inputs.platforms == 'all'
        name: Build Windows Packages

        runs-on: windows-2022

        steps:
            - name: Prepare VC++ Runtime
              run: choco install -y vcredist2017

            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.SACP_TOKEN || github.token }}
                  ref: refs/tags/${{ needs.release.outputs.tag }}
                  submodules: 'true'

            - name: Checkout submodules
              run: git submodule update --init --recursive

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: 3.11

            - name: Install dependencies
              run: python -m pip install --upgrade pip

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - run: npm install -g npm
            - run: npm install

            - run: npm run build

            # ----------------------------------------------------------------
            # Build Windows x64
            # ----------------------------------------------------------------
            - name: Build Windows x64 Binaries
              run: npm run build:win-x64

            - name: Save Windows packages
              uses: actions/upload-artifact@v4
              with:
                  name: release-windows
                  if-no-files-found: error
                  path: |
                      ./output/*.exe
                      ./output/*.yml
                      ./output/*.blockmap

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ github.token }}
                  tag_name: ${{ needs.release.outputs.tag }}
                  prerelease: ${{ needs.release.outputs.prerelease }}
                  fail_on_unmatched_files: true
                  files: |
                      ./output/*.exe
                      ${{ hashFiles('output/*.yml') != '' && './output/*.yml' || '' }}
                      ${{ hashFiles('output/*.blockmap') != '' && './output/*.blockmap' || '' }}

    build-macos:
        needs: release
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'macos' || inputs.platforms == 'all'
        name: Build macOS Packages

        # macos-11.7
        runs-on: macos-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.SACP_TOKEN || github.token }}
                  ref: refs/tags/${{ needs.release.outputs.tag }}
                  submodules: 'true'

            - name: Checkout submodules
              run: git submodule update --init --recursive

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: 3.11

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            # install setuptools to reintroduce distutils missing in Python 3.12
            # https://github.com/nodejs/node-gyp/issues/2869
            - run: pip install setuptools
            - run: npm install

            - run: npm run build

            # ----------------------------------------------------------------
            # Build macOS x64 & arm64
            # ----------------------------------------------------------------
            - name: Build macOS Binaries
              run: npm run build:mac
              env:
                  TEAMID: ${{ secrets.TEAM_ID_MACOS }}
                  CSC_LINK: ${{ secrets.CSC_LINK_MACOS }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD_MACOS }}
                  APPLEID: ${{ secrets.APPLEID }}
                  APPLEIDPASS: ${{ secrets.APPLEIDPASS }}

            - name: Save macOS packages
              uses: actions/upload-artifact@v4
              with:
                  name: release-macos
                  if-no-files-found: error
                  path: |
                      ./output/*.zip
                      ./output/*.dmg
                      ./output/*.yml
                      ./output/*.blockmap

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ github.token }}
                  tag_name: ${{ needs.release.outputs.tag }}
                  prerelease: ${{ needs.release.outputs.prerelease }}
                  fail_on_unmatched_files: true
                  files: |
                      ./output/*-mac-x64.zip
                      ./output/*-mac-x64.dmg
                      ./output/*-mac-arm64.zip
                      ./output/*-mac-arm64.dmg
                      ${{ hashFiles('output/*.yml') != '' && './output/*.yml' || '' }}
                      ${{ hashFiles('output/*.blockmap') != '' && './output/*.blockmap' || '' }}

            - name: Init OSS
              if: github.repository == 'Snapmaker/Luban'
              uses: yizhoumo/setup-ossutil@v1
              with:
                  ossutil-version: '1.7.0'
                  endpoint: ${{ secrets.OSS_ENDPOINT }}
                  access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
                  access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

            - name: Upload Release macOS Installer OSS
              if: github.repository == 'Snapmaker/Luban'
              run: |
                  ossutil cp -f ./output/ ${{secrets.OSS_UPDATE_PATH}}/ --include "*.dmg" -r
                  ossutil cp -f ./output/ ${{secrets.OSS_UPDATE_PATH}}/ --include "*.zip" -r

    build-linux:
        needs: release
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'linux' || inputs.platforms == 'all'
        name: Build Linux Packages

        # Pinned: ubuntu-latest moved to a 26.04 image (2026-10-19) whose rpmbuild fails the .rpm target.
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.SACP_TOKEN || github.token }}
                  ref: refs/tags/${{ needs.release.outputs.tag }}
                  submodules: 'true'

            - name: Checkout submodules
              run: git submodule update --init --recursive

            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y python3 make g++ build-essential fontconfig libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: 3.11

            - name: Install dependencies
              run: |
                sudo ln -sf /usr/bin/python3 /usr/bin/python
                python -m pip install --upgrade pip

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - run: npm install --unsafe-perm

            - run: npm run build

            # ----------------------------------------------------------------
            # Build Linux x64
            # ----------------------------------------------------------------
            - name: Build Linux x64 Binaries
              run: npm run build:linux-x64

            - run: |
                  PRODUCT_NAME="Snapmaker Luban"
                  PACKAGE_NAME="Snapmaker-luban"
                  PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
                  RELEASE=${PACKAGE_NAME}-${PACKAGE_VERSION}

                  ln -sf ./output/linux-unpacked "${RELEASE}-linux-x64"
                  tar zcfh "./output/${RELEASE}-linux-x64.tar.gz" "${RELEASE}-linux-x64"
                  rm -f "${RELEASE}-linux-x64"

            - name: Save Linux packages
              uses: actions/upload-artifact@v4
              with:
                  name: release-linux
                  if-no-files-found: error
                  path: |
                      ./output/*.deb
                      ./output/*.rpm
                      ./output/*.tar.gz

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ github.token }}
                  tag_name: ${{ needs.release.outputs.tag }}
                  prerelease: ${{ needs.release.outputs.prerelease }}
                  fail_on_unmatched_files: true
                  files: |
                      ./output/*.deb
                      ./output/*.rpm
                      ./output/*.tar.gz

            - name: Init OSS
              if: github.repository == 'Snapmaker/Luban'
              uses: yizhoumo/setup-ossutil@v1
              with:
                  ossutil-version: '1.7.0'
                  endpoint: ${{ secrets.OSS_ENDPOINT }}
                  access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
                  access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

            - name: Upload Release linux Installer To OSS
              if: github.repository == 'Snapmaker/Luban'
              run: |
                  ossutil cp -f ./output/ ${{secrets.OSS_UPDATE_PATH}}/ --include "*.deb" -r
                  ossutil cp -f ./output/ ${{secrets.OSS_UPDATE_PATH}}/ --include "*.rpm" -r
                  ossutil cp -f ./output/ ${{secrets.OSS_UPDATE_PATH}}/ --include "*.tar.gz" -r
